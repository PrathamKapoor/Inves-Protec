{{- if not .Values.secrets.existingSecretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sangyan.fullname" . }}-secrets
  labels:
    {{- include "sangyan.labels" . | nindent 4 }}
type: Opaque
stringData:
  SANGYAN_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SANGYAN_BACKUP_ENCRYPTION_KEY: {{ .Values.secrets.backupEncryptionKey | quote }}
{{- end }}
