{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sangyan.fullname" . }}
  labels:
    {{- include "sangyan.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sangyan.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to port 8000 from cluster ingress controllers
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8000
    # Allow Prometheus scrapers to query metrics internally
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
    # Allow same-namespace communication (migration Job / backup CronJob)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow CoreDNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTPS/HTTP for authoritative regulatory registries (SEBI, MCA, Circulars)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Allow database egress (if external PostgreSQL is configured)
    - ports:
        - protocol: TCP
          port: 5432
    # Allow Redis egress (cluster-wide rate limiting and auth throttling)
    - ports:
        - protocol: TCP
          port: 6379
{{- end }}
