apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sangyan.fullname" . }}-config
  labels:
    {{- include "sangyan.labels" . | nindent 4 }}
data:
  SANGYAN_ENV: {{ .Values.config.env | quote }}
  SANGYAN_HOST: "0.0.0.0"
  SANGYAN_PORT: "8000"
  SANGYAN_DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  SANGYAN_CHECKPOINT_DB_PATH: {{ .Values.config.checkpointDbPath | quote }}
  SANGYAN_KEY_DIR: {{ .Values.config.keyDir | quote }}
  SANGYAN_BACKUP_DIR: {{ .Values.config.backupDir | quote }}
  SANGYAN_ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  SANGYAN_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SANGYAN_JWT_ALGORITHMS: {{ .Values.config.jwtAlgorithms | quote }}
  SANGYAN_JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  SANGYAN_JWT_AUDIENCE: {{ .Values.config.jwtAudience | quote }}
  SANGYAN_JWT_LEEWAY: {{ .Values.config.jwtLeeway | quote }}
  SANGYAN_REQUIRE_AUTH: "true"
  SANGYAN_RATE_LIMIT_ENABLED: {{ .Values.config.rateLimitEnabled | quote }}
  SANGYAN_MAX_REQUEST_BODY_BYTES: {{ .Values.config.maxRequestBodyBytes | quote }}
  SANGYAN_AUTO_MIGRATE: "false"  # Managed exclusively via migration hook Job
  {{- if .Values.config.redisUrl }}
  SANGYAN_REDIS_URL: {{ .Values.config.redisUrl | quote }}
  SANGYAN_REDIS_FAILURE_MODE: {{ .Values.config.redisFailureMode | default "fail_closed_mutations" | quote }}
  {{- end }}
  {{- if .Values.config.checkpointBackend }}
  SANGYAN_CHECKPOINT_BACKEND: {{ .Values.config.checkpointBackend | quote }}
  {{- end }}
  {{- if .Values.config.tracingEnabled }}
  SANGYAN_TRACING_ENABLED: {{ .Values.config.tracingEnabled | quote }}
  SANGYAN_TRACE_SAMPLE_RATE: {{ .Values.config.traceSampleRate | default 0.1 | quote }}
  SANGYAN_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | default "" | quote }}
  {{- end }}
  {{- if .Values.config.backupStorageProvider }}
  SANGYAN_BACKUP_STORAGE_PROVIDER: {{ .Values.config.backupStorageProvider | quote }}
  SANGYAN_BACKUP_S3_BUCKET: {{ .Values.config.backupS3Bucket | default "" | quote }}
  SANGYAN_BACKUP_S3_REGION: {{ .Values.config.backupS3Region | default "ap-south-1" | quote }}
  SANGYAN_BACKUP_S3_PREFIX: {{ .Values.config.backupS3Prefix | default "backups/sangyan" | quote }}
  {{- end }}
