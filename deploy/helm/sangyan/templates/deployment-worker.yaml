{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sangyan.fullname" . }}-worker
  labels:
    {{- include "sangyan.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "sangyan.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "sangyan.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Graceful drain window: SIGTERM -> stop claiming -> finish in-flight tasks
      # (bounded by the worker drain timeout) -> release leases cleanly.
      terminationGracePeriodSeconds: 90
      # Spread worker pods across nodes (preferred, never blocking): reduces
      # correlated lease contention and node-drain blast radius.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "sangyan.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: worker
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sangyan.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "sangyan.cli", "worker", "--poll-ms", "1000", "--lease-sec", "60", "--concurrency", "4"]
          envFrom:
            - configMapRef:
                name: {{ include "sangyan.fullname" . }}-config
            - secretRef:
                name: {{ include "sangyan.secretName" . }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            # Relational task ledger / investigation store (SQLite single-node topology;
            # unused when SANGYAN_DATABASE_URL points at PostgreSQL)
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/checkpoints
            - name: keys
              mountPath: /app/keys
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sangyan.fullname" . }}-data
        - name: checkpoints
          persistentVolumeClaim:
            claimName: {{ include "sangyan.fullname" . }}-checkpoints
        - name: keys
          persistentVolumeClaim:
            claimName: {{ include "sangyan.fullname" . }}-keys
        - name: tmp
          emptyDir: {}
{{- end }}
