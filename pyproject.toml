[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sangyan"
version = "0.1.0"
description = "SANGYAN: Investor Safety & Content Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PrathamKapoor", email = "prathamkapoor027@gmail.com" }
]
dependencies = [
    "dilithium-py>=1.4.0",
    "kyber-py>=1.2.0",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "starlette>=0.36",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]
postgres = [
    "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
sangyan = "sangyan.cli:cli"

[tool.setuptools.packages.find]
include = ["sangyan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
